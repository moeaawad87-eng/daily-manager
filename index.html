<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mohamad Daily Manager</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192-v2.png">
<link rel="apple-touch-icon" href="apple-touch-icon-v2.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Daily Manager">
<meta name="theme-color" content="#3B4A7D">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<style>
:root{
  --forest:#46569E; --forest-deep:#3B4A7D; --cream:#F5F7FC; --paper:#FFFFFF;
  --ink:#1B2236; --ink-soft:#5E6781; --line:#E3E7F2;
  --gold:#B4863A; --clay:#B4522F; --sky:#3E6E8E; --plum:#7A5C8A;
  --ok:#3E7A54;
  --r: 10px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --forest:#5C7BF0; --forest-deep:#2A2F6B; --cream:#14161F; --paper:#1D2030;
    --ink:#ECEEF6; --ink-soft:#A3AAC2; --line:#2B3045;
  }
}
:root[data-theme="dark"]{
  --forest:#5C7BF0; --forest-deep:#2A2F6B; --cream:#14161F; --paper:#1D2030;
  --ink:#ECEEF6; --ink-soft:#A3AAC2; --line:#2B3045;
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--cream);color:var(--ink);font-family:'Inter',system-ui,sans-serif;font-size:15px;line-height:1.5;height:100%}
html,body{height:100%}
h1,h2,h3{font-family:'Fraunces',Georgia,serif;font-weight:600;margin:0}
button{font-family:inherit;cursor:pointer}
input,textarea,select{font-family:inherit;font-size:14px}
.app{display:flex;min-height:100%}
/* Sidebar */
.side{width:230px;flex:none;background:#3B4A7D;color:#fff;display:flex;flex-direction:column;padding:20px 14px;padding-top:calc(20px + env(safe-area-inset-top,0px))}
.brand{display:flex;gap:10px;align-items:center;padding:4px 8px 22px}
.brand .mark{width:34px;height:34px;border-radius:8px;background:#B08A47;display:flex;align-items:center;justify-content:center;font-family:'Fraunces',serif;font-weight:600;color:#1B140A}
.brand div b{display:block;font-size:14.5px}
.brand div span{font-size:11.5px;color:rgba(255,255,255,.8)}
nav{display:flex;flex-direction:column;gap:2px;flex:1}
nav button{display:flex;align-items:center;gap:10px;background:none;border:none;color:rgba(255,255,255,.82);text-align:left;padding:9px 10px;border-radius:8px;font-size:13.8px}
nav button .n{margin-left:auto;background:var(--clay);color:#fff;font-size:11px;padding:1px 6px;border-radius:20px}
nav button.active{background:rgba(255,255,255,.14);color:#fff;font-weight:600}
nav button:hover{background:rgba(255,255,255,.08)}
.side-foot{font-size:12px;color:rgba(255,255,255,.75);padding:10px 8px 0;border-top:1px solid rgba(255,255,255,.08);margin-top:10px;padding-top:12px}
/* Main */
main{flex:1;min-width:0;padding:26px 30px 60px;max-width:1160px}
.topbar{display:flex;gap:14px;align-items:center;margin-bottom:26px}
.search{flex:1;background:var(--paper);border:1px solid var(--line);border-radius:9px;padding:9px 14px;color:var(--ink-soft);font-size:13.5px}
.iconbtn{width:38px;height:38px;border-radius:9px;border:1px solid var(--line);background:var(--paper);display:flex;align-items:center;justify-content:center}
.addbtn{background:var(--forest);color:#fff;border:none;border-radius:9px;padding:9px 16px;font-weight:600;font-size:13.5px;display:flex;gap:6px;align-items:center}
.eyebrow{color:var(--gold);font-size:12.5px;font-weight:600;letter-spacing:.02em}
h1.title{font-size:30px;margin:4px 0 6px}
.sub{color:var(--ink-soft);font-size:14px;margin-bottom:22px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:22px}
.stat{background:var(--paper);border:1px solid var(--line);border-top:3px solid var(--c,var(--forest));border-radius:var(--r);padding:14px 16px;transition:background .15s,border-color .15s}
.stat .num{font-family:'Fraunces',serif;font-size:26px}
.stat .lbl{color:var(--ink-soft);font-size:12.5px;margin-top:2px}
.stats .stat:nth-child(1){background:#FCE8E6}
.stats .stat:nth-child(2){background:#E3F5EA}
.stats .stat:nth-child(3){background:#E5EEFC}
.stats .stat:nth-child(4){background:#FBF1D6}
.stats .stat:nth-child(5){background:#EDE4FB}
.stats .stat .num{color:#1B2420}
.stats .stat .lbl{color:#4A544E}
.stats .stat.active{background:#3BAA6C}
.stat.active{background:#3BAA6C;border-color:#3BAA6C}
.stats .stat.active .num,.stats .stat.active .lbl{color:#fff}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;margin-bottom:18px}
.panel h2{font-size:17px;margin-bottom:2px}
.panel .count{color:var(--ink-soft);font-size:13px;margin-bottom:14px}
.row{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:none}
.row input[type=checkbox]{margin-top:3px;width:16px;height:16px;accent-color:var(--forest)}
.row .txt b{font-size:14px}
.row .txt p{margin:3px 0 0;color:var(--ink-soft);font-size:13px}
.tag{display:inline-block;font-size:10.5px;font-weight:600;padding:2px 7px;border-radius:5px;margin-right:6px;vertical-align:middle}
.tag.work{background:#E4EEE9;color:var(--ok)}
.tag.personal{background:#EEE6F2;color:var(--plum)}
.tag.high{background:#F7E4DE;color:var(--clay)}
.tag.reminder{background:#F2EAD9;color:var(--gold)}
.meta{color:var(--ink-soft);font-size:12px;margin-left:auto;white-space:nowrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:var(--paper);border:1px solid var(--line);border-left:3px solid var(--c,var(--gold));border-radius:8px;padding:14px}
.card b{font-size:13.8px}
.hero{position:relative;border-radius:16px;overflow:hidden;min-height:200px;margin-bottom:22px;background:#3B4A7D;display:flex;flex-direction:column;justify-content:space-between;padding:22px 24px;color:#fff;background-size:cover;background-position:center}
.hero::before{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(12,42,33,.35),rgba(12,42,33,.78));z-index:0}
.hero>*{position:relative;z-index:1}
.hero-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.hero-eyebrow{font-size:12px;letter-spacing:.04em;opacity:.85}
.hero-greet{font-family:'Fraunces',serif;font-size:28px;margin-top:2px}
.hero-weather{text-align:right;font-size:13px;opacity:.95;white-space:nowrap}
.hero-weather .temp{font-family:'Fraunces',serif;font-size:24px;line-height:1}
.hero-quote{font-family:'Fraunces',serif;font-style:italic;font-size:15px;line-height:1.5;max-width:420px;opacity:.95;border-left:2px solid rgba(255,255,255,.5);padding-left:12px;margin-top:14px}
.quickgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:22px}
@media (max-width:640px){.quickgrid{grid-template-columns:repeat(3,1fr)}}
.qcard{border:none;border-radius:12px;padding:14px 10px;text-align:center;cursor:pointer;color:#fff;display:flex;flex-direction:column;align-items:center;gap:6px;font-family:inherit}
.qcard .qicon{font-size:20px}
.qcard .qlabel{font-size:12px;font-weight:600}
.qcard .qcount{font-size:10.5px;opacity:.85}
.card p{margin:5px 0 0;color:var(--ink-soft);font-size:12.8px}
.empty{color:var(--ink-soft);font-size:13.5px;padding:18px 0;text-align:center}
.quickgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.qtile{border:1px dashed var(--line);border-radius:9px;background:var(--cream);padding:16px 8px;text-align:center;font-size:12.5px;color:var(--ink-soft)}
form.inline{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
form.inline input,form.inline select{padding:8px 10px;border:1px solid var(--line);border-radius:7px;background:var(--paper);color:var(--ink)}
form.inline input[type=text]{flex:1;min-width:140px}
form.inline button{background:var(--forest);color:#fff;border:none;border-radius:7px;padding:8px 14px;font-weight:600;font-size:13px}
.del{background:none;border:none;color:var(--ink-soft);font-size:12px}
.del:hover{color:var(--clay)}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.calgrid .d{background:var(--paper);border:1px solid var(--line);border-radius:7px;min-height:64px;padding:6px;font-size:12px}
.calgrid .d.out{opacity:.35}
.calgrid .d.today{border-color:var(--gold);border-width:2px}
.calgrid .dot{width:5px;height:5px;border-radius:50%;background:var(--clay);display:inline-block;margin-top:3px}
.mic{width:38px;height:38px;border-radius:9px;border:1px solid var(--line);background:var(--paper);display:flex;align-items:center;justify-content:center;font-size:15px}
.mic.on{background:var(--clay);color:#fff;border-color:var(--clay)}
.mic:disabled{opacity:.35;cursor:not-allowed}
.notephoto{width:100%;border-radius:6px;margin-top:8px;display:block;max-height:160px;object-fit:cover}
.bggrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;margin-top:14px}
.bgthumb{position:relative;border-radius:8px;overflow:hidden;border:1px solid var(--line);aspect-ratio:4/3}
.bgthumb img{width:100%;height:100%;object-fit:cover;display:block}
.bgthumb button{position:absolute;top:5px;right:5px;background:rgba(0,0,0,.55);color:#fff;border:none;border-radius:5px;font-size:11px;padding:2px 6px}
.filebtn{border:1px dashed var(--line);border-radius:8px;background:var(--cream);color:var(--ink-soft);padding:9px 14px;font-size:13px}
main{position:relative}
main.has-bg::before{content:'';position:absolute;inset:0;background-size:cover;background-position:center;opacity:.08;pointer-events:none;z-index:0}
main.has-bg>*{position:relative;z-index:1}
.survcard{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px;cursor:pointer}
.survcard:hover{border-color:var(--gold)}
.sectiongrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px;margin-top:14px}
.sectioncard{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.sectioncard img{width:100%;height:150px;object-fit:cover;display:block;background:var(--cream)}
.sectioncard .sc-body{padding:12px 14px}
.sectioncard .sc-body b{font-size:14.5px}
.sectioncard .sc-body .lbl{font-size:11px;color:var(--gold);font-weight:600;margin-top:8px;display:block}
.sectioncard .sc-body p{margin:2px 0 0;font-size:12.8px;color:var(--ink-soft);white-space:pre-wrap}
.backlink{background:none;border:none;color:var(--gold);font-weight:600;font-size:13px;margin-bottom:14px;cursor:pointer}
@media print{
  .side, .topbar, .backlink, form, .del, .addbtn, .mic{display:none !important}
  main{padding:0 !important}
  body{background:#fff}
  .panel{border:none !important;box-shadow:none !important;padding:8px 0 !important}
  .photoitem{break-inside:avoid;border-top:1px solid #ccc !important}
}
.tabbar{display:none}
@media(max-width:820px){
  .app{flex-direction:column}
  .side{display:none}
  #quickAddBtn,#newWinBtn{display:none}
  .topbar{gap:10px}
  .search{min-width:0}
  main{padding:18px 16px calc(96px + env(safe-area-inset-bottom,0px))}
  .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--paper);border-top:1px solid var(--line);justify-content:space-around;align-items:flex-end;padding:6px 6px calc(8px + env(safe-area-inset-bottom,0px));box-shadow:0 -4px 16px rgba(0,0,0,.06)}
  .tabbar button{flex:1;background:none;border:none;color:var(--ink-soft);font-family:inherit;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;position:relative;cursor:pointer}
  .tabbar button .ti{font-size:21px;line-height:1}
  .tabbar button.on{color:var(--forest);font-weight:700}
  .tabbar button.plus .ti{width:54px;height:54px;border-radius:50%;background:var(--forest);color:#fff;display:flex;align-items:center;justify-content:center;font-size:30px;margin-top:-26px;box-shadow:0 4px 12px rgba(70,86,158,.3)}
  .tabbar .badge{position:absolute;top:0;right:calc(50% - 20px);background:var(--clay);color:#fff;border-radius:10px;font-size:10px;min-width:16px;height:16px;line-height:16px;text-align:center;padding:0 4px;font-weight:700}
  .brand{padding:0 10px 0 0}
  nav button .n{display:none}
  .side-foot{display:none}
  .grid2{grid-template-columns:1fr}
  .quickgrid{grid-template-columns:repeat(3,1fr)}
}
</style>
</head>
<body>
<div class="tabbar" id="tabbar"></div>
<div class="app">
  <aside class="side">
    <div class="brand"><div class="mark">M</div><div><b>Mohamad</b><span>Daily Manager</span></div></div>
    <nav id="nav"></nav>
    <div class="side-foot">Private workspace &middot; saved on this device</div>
  </aside>
  <main>
    <div class="topbar">
      <button class="mic" id="backBtnGlobal" title="Go back">←</button>
      <input class="search" placeholder="Search anything…" id="search">
      <button class="mic" id="micBtn" title="Add a task by voice">🎙</button>
      <button class="mic" id="newWinBtn" title="Open in a new window">⧉</button>
      <button class="addbtn" id="quickAddBtn">+ Add new</button>
    </div>
    <div id="view"></div>
  </main>
</div>

<script>
const store = { get(k,d){ try{ const v=localStorage.getItem('mdm_'+k); return v?JSON.parse(v):d; }catch(e){ return d; } },
  set(k,v){ try{ localStorage.setItem('mdm_'+k, JSON.stringify(v)); }catch(e){} } };

let data = {
  tasks: store.get('tasks', [
    {id:1,title:'Engineer Aya – BMW and villa work',note:'Call to follow up on new BMW work and villa project she promised.',tag:'work',priority:'reminder',due:'2026-09-02',done:false},
    {id:2,title:'M4 pots',note:'Got approvals — start buying pots and artificial plants for M4.',tag:'work',priority:'high',due:'2026-09-05',done:false},
  ]),
  notes: store.get('notes', []),
  followups: store.get('followups', []),
  projects: store.get('projects', [{id:1,name:'M4 Material Submittal',status:'active'},{id:2,name:'Tawazun Pots – Abraj Al Baher',status:'active'}]),
  expenses: store.get('expenses', []),
  backgrounds: store.get('backgrounds', []),
  schedule: store.get('schedule', []),
  surveys: store.get('surveys', []),
  scratch: store.get('scratch', ['']),
};
const firebaseConfig = {
  apiKey: "AIzaSyBvQ1-8G5H-_YnX3Cvna7i6nwWaykxKU_M",
  authDomain: "mohamad-daily-manager.firebaseapp.com",
  projectId: "mohamad-daily-manager",
  storageBucket: "mohamad-daily-manager.firebasestorage.app",
  messagingSenderId: "510364490724",
  appId: "1:510364490724:web:6862b52337d98a3f5005f1"
};
firebase.initializeApp(firebaseConfig);
const SYNC_KEYS = ['tasks','notes','followups','projects','expenses','backgrounds','schedule','surveys','scratch'];
const fsdocs = {}; SYNC_KEYS.forEach(k=>{ fsdocs[k] = firebase.firestore().collection('app').doc(k); });
let cloudReady=false;
const syncTimers = {}, applyingRemote = {};
function save(k){ store.set(k, data[k]); queueCloudSync(k); }
// Firestore refuses any single document over 1 MB. Each category is one document,
// so photos (receipts, backgrounds, notes) can push a category over the limit.
const DOC_LIMIT = 1000000, DOC_WARN = 850000;
const syncErrors = {};
const SYNC_NAMES = {tasks:'Tasks',notes:'Notes',followups:'Follow-ups',projects:'Projects',expenses:'Expenses',backgrounds:'Background photos',schedule:'Schedule',surveys:'Site surveys',scratch:'Scratchpad'};
function docSize(k){ try{ return new Blob([JSON.stringify({items:data[k]})]).size; }catch(e){ return 0; } }
function setSyncError(k,msg){ if(msg) syncErrors[k]=msg; else delete syncErrors[k]; if(current==='settings') renderView(); }
// ---- Photos: each photo / receipt lives in its own cloud document ("blobs"),
// and the lists only keep a short "blob:<id>" reference. This keeps every list
// far below the 1 MB limit, however many photos you add.
const BLOB_MIN = 20000;           // inline images bigger than this get moved out
const BLOB_MAX = 1000000;         // one photo/file must fit in one document
const BLANK_IMG = 'data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==';
const blobCache = {}, blobLoading = {}, lastRefs = {};
const blobsCol = () => firebase.firestore().collection('blobs');
function isBlobRef(v){ return typeof v==='string' && v.startsWith('blob:'); }
let blobRenderTimer = null;
function loadBlob(id){
  if(blobCache[id] || blobLoading[id] || !cloudReady) return blobLoading[id];
  blobLoading[id] = blobsCol().doc(id).get().then(s=>{
    const d = s.exists && s.data();
    if(d && d.data){ blobCache[id]=d.data; clearTimeout(blobRenderTimer); blobRenderTimer=setTimeout(()=>{ renderView(); applyBackground(); },60); }
  }).catch(()=>{}).finally(()=>{ delete blobLoading[id]; });
  return blobLoading[id];
}
// Use in templates: returns the picture now if we have it, otherwise a blank and loads it.
function img(v){
  if(!isBlobRef(v)) return v||'';
  const id=v.slice(5);
  if(blobCache[id]) return blobCache[id];
  loadBlob(id); return BLANK_IMG;
}
async function resolveBlob(v){
  if(!isBlobRef(v)) return v||'';
  const id=v.slice(5);
  if(!blobCache[id]) await loadBlob(id);
  return blobCache[id]||'';
}
async function inlineCopy(v){ // full copy with real pictures, for backups
  if(isBlobRef(v)) return await resolveBlob(v);
  if(Array.isArray(v)) return Promise.all(v.map(inlineCopy));
  if(v && typeof v==='object'){ const o={}; for(const key in v) o[key]=await inlineCopy(v[key]); return o; }
  return v;
}
function collectRefs(v, out=new Set()){
  if(isBlobRef(v)) out.add(v.slice(5));
  else if(Array.isArray(v)) v.forEach(x=>collectRefs(x,out));
  else if(v && typeof v==='object') for(const key in v) collectRefs(v[key],out);
  return out;
}
async function externalizeImages(k){
  const found=[];
  const walk=(o)=>{ for(const key of Object.keys(o)){ const v=o[key];
    if(typeof v==='string'){ if(v.startsWith('data:') && v.length>BLOB_MIN) found.push([o,key,v]); }
    else if(v && typeof v==='object') walk(v); } };
  if(data[k] && typeof data[k]==='object') walk(data[k]);
  let changed=false, tooBig=0;
  for(const [obj,key,v] of found){
    if(v.length > BLOB_MAX){ tooBig++; continue; }
    const id = Date.now().toString(36)+Math.random().toString(36).slice(2,8);
    try{
      await blobsCol().doc(id).set({data:v, created:Date.now()});
      blobCache[id]=v;
      if(obj[key]===v){ obj[key]='blob:'+id; changed=true; }
    }catch(e){ setSyncError('photo_'+k, `A photo in ${SYNC_NAMES[k]||k} did not upload: ${String(e&&e.message||e).slice(0,120)}`); return; }
  }
  setSyncError('photo_'+k, tooBig ? `${tooBig} file${tooBig>1?'s':''} in ${SYNC_NAMES[k]||k} ${tooBig>1?'are':'is'} bigger than 1 MB, so ${tooBig>1?'they stay':'it stays'} on this device only. Use a smaller file or a photo instead.` : '');
  if(changed) store.set(k, data[k]);
}
// Drop the cloud copy of photos that were removed from a list.
function cleanupBlobs(k){
  const now = collectRefs(data[k]);
  (lastRefs[k]||new Set()).forEach(id=>{ if(!now.has(id)){ blobsCol().doc(id).delete().catch(()=>{}); delete blobCache[id]; } });
  lastRefs[k] = now;
}
const pushing = {}, pushAgain = {};
async function pushToCloud(k){
  if(pushing[k]){ pushAgain[k]=true; return; }
  pushing[k]=true;
  try{
    await externalizeImages(k);
    const size = docSize(k);
    if(size > DOC_LIMIT){
      setSyncError(k, `${SYNC_NAMES[k]||k} is too big to sync (${(size/1e6).toFixed(2)} MB, limit 1 MB). It is saved on this device only. Remove some large files here to sync again.`);
      return;
    }
    await fsdocs[k].set({items:data[k]});
    setSyncError(k,'');
    cleanupBlobs(k);
  }catch(err){ setSyncError(k, `${SYNC_NAMES[k]||k} did not sync: ${String(err&&err.message||err).slice(0,140)}`); }
  finally{ pushing[k]=false; if(pushAgain[k]){ pushAgain[k]=false; pushToCloud(k); } }
}
function queueCloudSync(k){
  if(applyingRemote[k] || !cloudReady) return; // never write before we have loaded the cloud copy
  clearTimeout(syncTimers[k]);
  syncTimers[k] = setTimeout(()=>pushToCloud(k), 600);
}
let syncStatus = 'checking';
let cloudListeners = [];
// Private sign-in: only the account created in Firebase can read or write the data.
firebase.auth().onAuthStateChanged(u=>{
  if(u && !u.isAnonymous){ initCloud(); }
  else {
    if(u && u.isAnonymous) firebase.auth().signOut().catch(()=>{}); // drop the old open-access session
    cloudListeners.forEach(f=>f()); cloudListeners=[];
    cloudReady=false; syncStatus='signedout'; renderNav(); if(current==='settings') renderView();
  }
});
async function cloudSignIn(email, password){
  await firebase.auth().signInWithEmailAndPassword(email, password);
}
async function initCloud(){
  try{
    syncStatus='checking';
    for(const k of SYNC_KEYS){
      const snap = await fsdocs[k].get();
      if(snap.exists){
        const remote = snap.data();
        if(remote && Array.isArray(remote.items)) data[k]=remote.items;
      } else {
        // First run after the storage upgrade: this category has no cloud copy yet.
        // Push whatever is already saved on this device so nothing looks lost.
        pushToCloud(k);
      }
    }
    cloudReady = true; syncStatus='connected';
    SYNC_KEYS.forEach(k=>{ lastRefs[k]=collectRefs(data[k]); });
    renderNav(); renderView(); applyBackground();
    // Move photos still stored inside the lists (older data) out to their own documents.
    SYNC_KEYS.forEach(k=>{ if(JSON.stringify(data[k]).includes('"data:')) pushToCloud(k); });
    SYNC_KEYS.forEach(k=>{
      cloudListeners.push(fsdocs[k].onSnapshot(snap=>{
        if(!snap.exists || snap.metadata.hasPendingWrites) return;
        const remote = snap.data();
        if(!remote || !Array.isArray(remote.items)) return;
        if(JSON.stringify(remote.items)!==JSON.stringify(data[k])){
          data[k]=remote.items; store.set(k,remote.items); lastRefs[k]=collectRefs(remote.items);
          applyingRemote[k]=true; renderNav(); renderView(); applyBackground(); applyingRemote[k]=false;
        }
      }, err=>setSyncError(k, `${SYNC_NAMES[k]||k} stopped syncing: ${String(err&&err.message||err).slice(0,140)}`)));
    });
  }catch(e){ syncStatus='unavailable'; syncErrors._load = String(e&&e.message||e).slice(0,160); if(current==='settings') renderView(); }
}

const views = ['today','calendar','schedule','tasks','followups','projects','surveys','notes','scratch','expenses','settings'];
const icons = {today:'☀',calendar:'▦',schedule:'⏰',tasks:'☑',followups:'↻',projects:'◧',surveys:'📐',notes:'▤',scratch:'✎',expenses:'▢',settings:'⚙'};
const labels = {followups:'Follow-ups',settings:'Settings',surveys:'Site Surveys',scratch:'Scratchpad'};
let current = (views.includes(location.hash.slice(1)) ? location.hash.slice(1) : 'today');
history.replaceState(null,'','#'+current);

function navigateTo(view){
  current = view;
  renderNav(); renderView();
  if(location.hash !== '#'+view) history.pushState(null,'','#'+view);
}
window.addEventListener('popstate', ()=>{
  const v = location.hash.slice(1);
  if(views.includes(v) && v!==current){ current=v; currentTaskId=null; currentSurveyId=null; renderNav(); renderView(); }
});

function renderTabbar(){
  const tb = document.getElementById('tabbar'); if(!tb) return;
  const t = todayISO();
  const alerts = data.tasks.filter(x=>!x.done && x.due && x.due<=t).length;
  tb.innerHTML = `
    <button data-tab="today" class="${current==='today'?'on':''}"><span class="ti">🏠</span>Home</button>
    <button data-tab="calendar" class="${current==='calendar'?'on':''}"><span class="ti">📅</span>Calendar</button>
    <button data-tab="add" class="plus"><span class="ti">+</span></button>
    <button data-tab="alerts"><span class="ti">🔔</span>Alerts${alerts?`<span class="badge">${alerts}</span>`:''}</button>
    <button data-tab="settings" class="${current==='settings'?'on':''}"><span class="ti">⚙️</span>Settings</button>`;
  tb.querySelectorAll('button').forEach(b=>b.onclick=()=>{
    const k=b.dataset.tab;
    if(k==='add'){ navigateTo('tasks'); document.querySelector('#addForm input[type=text]')?.focus(); }
    else if(k==='alerts'){ navigateTo('today'); setTimeout(()=>document.getElementById('panel-overdue')?.scrollIntoView({behavior:'smooth',block:'start'}),50); }
    else navigateTo(k);
  });
}
function renderNav(){
  renderTabbar();
  const nav = document.getElementById('nav');
  nav.innerHTML = views.map(v=>{
    const label = labels[v] || v[0].toUpperCase()+v.slice(1);
    const n = v==='followups' ? data.followups.filter(f=>!f.done).length : 0;
    return `<button data-v="${v}" class="${v===current?'active':''}">${icons[v]} ${label}${n?`<span class="n">${n}</span>`:''}</button>`;
  }).join('');
  nav.querySelectorAll('button').forEach(b=>b.onclick=()=>navigateTo(b.dataset.v));
}

function applyBackground(){
  const main = document.querySelector('main');
  if(data.backgrounds.length){
    const pick = img(data.backgrounds[Math.floor(Date.now()/3600000)%data.backgrounds.length]);
    main.classList.add('has-bg');
    main.style.setProperty('--bgimg', `url(${pick})`);
    main.style.setProperty('background', 'none');
    let s=document.getElementById('bgStyle');
    if(!s){ s=document.createElement('style'); s.id='bgStyle'; document.head.appendChild(s); }
    s.textContent = `main.has-bg::before{background-image:url(${pick})}`;
  } else {
    main.classList.remove('has-bg');
  }
}

function fmtDate(iso){
  if(!iso) return '';
  const d = new Date(iso+'T00:00:00');
  return d.toLocaleDateString('en-GB',{day:'numeric',month:'short'});
}
function todayISO(){ return new Date().toISOString().slice(0,10); }

function tagHtml(t){ return t?`<span class="tag ${t}">${t}</span>`:''; }

function renderView(){
  const el = document.getElementById('view');
  if(current==='today') return renderToday(el);
  if(current==='calendar') return renderCalendar(el);
  if(current==='tasks') return currentTaskId ? renderTaskDetail(el) : renderList(el,'tasks','Tasks','What needs doing');
  if(current==='followups') return renderList(el,'followups','Follow-ups','People and things to chase');
  if(current==='projects') return renderProjects(el);
  if(current==='notes') return renderNotes(el);
  if(current==='scratch') return renderScratch(el);
  if(current==='expenses') return renderExpenses(el);
  if(current==='schedule') return renderSchedule(el);
  if(current==='surveys') return renderSurveys(el);
  if(current==='settings') return renderSettings(el);
}

let weatherData = null;

async function fetchWeather(){
  try{
    const cached = store.get('weatherCache', null);
    if(cached && Date.now()-cached.at < 3600000){ weatherData = cached.data; if(current==='today') renderView(); return; }
    const res = await fetch('https://api.open-meteo.com/v1/forecast?latitude=24.4539&longitude=54.3773&current=temperature_2m,weather_code&timezone=Asia%2FDubai');
    const j = await res.json();
    weatherData = {temp: Math.round(j.current.temperature_2m), code: j.current.weather_code};
    store.set('weatherCache', {at: Date.now(), data: weatherData});
    if(current==='today') renderView();
  }catch(e){ /* weather optional — fail quietly */ }
}
fetchWeather();

function rowHtml(x){

}
function toggleTask(id){ const t=data.tasks.find(x=>x.id===id); if(t){ t.done=!t.done; save('tasks'); renderView(); } }
function escapeHtml(s){ return (s||'').replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function icsEscape(s){ return String(s||'').replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\n/g,'\\n'); }
function icsDateTime(dateISO, time){
  const d = dateISO.replace(/-/g,'');
  if(time){ return `${d}T${time.replace(':','')}00`; }
  return d;
}
function generateICS(){
  const lines = ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Mohamad Daily Manager//EN','CALSCALE:GREGORIAN'];
  const stamp = new Date().toISOString().replace(/[-:]/g,'').split('.')[0]+'Z';
  const addEvent = (uid, dateISO, time, summary, description)=>{
    if(!dateISO) return;
    lines.push('BEGIN:VEVENT');
    lines.push('UID:'+uid+'@dailymanager.moeaawad87');
    lines.push('DTSTAMP:'+stamp);
    if(time){
      lines.push('DTSTART:'+icsDateTime(dateISO,time));
      let [hh,mm] = time.split(':').map(Number);
      hh = (hh+1)%24;
      const endTime = String(hh).padStart(2,'0')+':'+String(mm).padStart(2,'0');
      lines.push('DTEND:'+icsDateTime(dateISO,endTime));
    } else {
      lines.push('DTSTART;VALUE=DATE:'+icsDateTime(dateISO,''));
      const d=new Date(dateISO+'T00:00:00'); d.setDate(d.getDate()+1);
      const endDate = `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}`;
      lines.push('DTEND;VALUE=DATE:'+endDate);
    }
    lines.push('SUMMARY:'+icsEscape(summary));
    if(description) lines.push('DESCRIPTION:'+icsEscape(description));
    lines.push('END:VEVENT');
  };
  data.tasks.filter(t=>t.due && !t.done).forEach(t=>{
    const c = t.customer||{};
    const desc = [c.name&&`Customer: ${c.name}`, c.phone&&`Phone: ${c.phone}`, c.location&&`Location: ${c.location}`, c.villa&&`Villa: ${c.villa}`, t.note].filter(Boolean).join('\n');
    addEvent('task-'+t.id, t.due, t.visitTime||'', t.title, desc);
  });
  data.schedule.forEach(s=>{ addEvent('sched-'+s.id, s.date, s.start||'', s.title, ''); });
  lines.push('END:VCALENDAR');
  return lines.join('\r\n');
}

}
function wazeLink(loc){

function nextDue(due,recur){
  const d = new Date(due+'T00:00:00');
  if(recur==='daily') d.setDate(d.getDate()+1);
  else if(recur==='weekly') d.setDate(d.getDate()+7);
  else if(recur==='monthly') d.setMonth(d.getMonth()+1);
  return d.toISOString().slice(0,10);
}

function parseProjectUpdate(text, p){
  const changes=[]; const t=text.toLowerCase();
  const m=t.match(/(\d{1,3})\s*%/);
  if(m){ const v=Math.min(100,+m[1]); p.progress=v; changes.push('Progress → '+v+'%'); }
  if(!(m && +m[1]<100) && /\b(done|completed|complete|finished|handed over|handover done|closed)\b/.test(t) && !/\bnot (done|complete|finished)\b/.test(t)){ p.status='done'; p.progress=100; changes.push('Status → Done'); }
  else if(/\b(on hold|paused|pause|waiting for|stopped)\b/.test(t)){ p.status='hold'; changes.push('Status → On hold'); }
  else if(/\b(resume|resumed|restart|restarted|reopen|reopened|started|kick.?off)\b/.test(t)){ p.status='active'; changes.push('Status → Active'); }
  const n=text.match(/next\s*(?:step)?\s*[:\-]\s*(.+)$/i);
  if(n){ p.next=n[1].trim(); changes.push('Next step → '+p.next); }
  return changes;
}
function projStatusLabel(s){ return s==='done'?'Done':s==='hold'?'On hold':'Active'; }
async function gfetch(url,opts){
  const ctl=new AbortController(); const t=setTimeout(()=>ctl.abort(),60000);
  try{
    const r=await fetch(url,Object.assign({signal:ctl.signal},opts||{}));
    if(!r.ok){ let msg=''; try{ msg=((await r.json()).error||{}).message||''; }catch(e){} throw new Error('Google replied '+r.status+(msg?': '+msg.slice(0,140):'')); }
    return r;
  }catch(e){
    if(e.name==='AbortError') throw new Error('no answer from Google after 60 seconds (try again in a minute)');
    if(e instanceof TypeError) throw new Error('could not reach Google ('+e.message+')');
    throw e;
  }finally{ clearTimeout(t); }
}
async function geminiPickModel(key){
  let m=store.get('geminiModel',''); if(m) return m;
  const r=await gfetch('https://generativelanguage.googleapis.com/v1beta/models?pageSize=200&key='+encodeURIComponent(key));
  const list=((await r.json()).models||[]).filter(x=>(x.supportedGenerationMethods||[]).includes('generateContent')).map(x=>x.name.replace('models/',''));
  const ok=list.filter(n=>/^gemini-/.test(n)&&/flash/.test(n)&&!/(image|tts|live|audio|thinking|exp|vision|embedding)/.test(n));
  m = ok.find(n=>n==='gemini-flash-lite-latest') || ok.filter(n=>/lite/.test(n)&&!/preview/.test(n)).sort().reverse()[0] || ok.find(n=>n==='gemini-flash-latest') || ok.filter(n=>!/lite/.test(n)).sort().reverse()[0] || ok.sort().reverse()[0];
  if(!m) throw new Error('no usable model found');
  store.set('geminiModel',m); return m;
}
async function aiProjectUpdate(p,text,keyArg){
  const key=keyArg||store.get('geminiKey',''); if(!key) throw new Error('no key');
  const prev=(p.updates||[]).slice(-6).map(u=>'- '+u.text).join('\n')||'(none)';
  const prompt=`You maintain a project tracker for a landscaping company in Abu Dhabi. The user writes project updates in English or Arabic.
Project: ${p.name}
Current progress: ${p.progress!=null?p.progress+'%':'not set'}; status: ${p.status||'active'}; next step: ${p.next||'not set'}
Earlier updates:
${prev}
Latest update:
${text}

Return ONLY JSON: {"progress": integer 0-100 or null, "status": "active"|"done"|"hold"|null, "next": string or null}
Rules: progress ONLY if the text states it or gives quantities that clearly imply it (for example "delivered 30 of 60 pots" means 50); never guess, otherwise null. status "done" only if the work is clearly finished, "hold" only if clearly paused or blocked, otherwise null. next = the next action mentioned (short, same language as the update), otherwise null.`;
  for(let attempt=0;attempt<2;attempt++){
    const model=await geminiPickModel(key);
    try{
    const r=await gfetch('https://generativelanguage.googleapis.com/v1beta/models/'+model+':generateContent?key='+encodeURIComponent(key),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({contents:[{parts:[{text:prompt}]}],generationConfig:{temperature:0.1,responseMimeType:'application/json'}})});
    const j=await r.json(); const t=j.candidates&&j.candidates[0]&&j.candidates[0].content&&j.candidates[0].content.parts.map(x=>x.text||'').join('');
    if(!t) throw new Error('empty answer');
    return JSON.parse(t.replace(/^```json|```$/g,'').trim());

  }
}
function applyAiResult(p,r){
  const ch=[];
  if(typeof r.progress==='number' && r.progress>=0 && r.progress<=100){ p.progress=Math.round(r.progress); ch.push('Progress → '+p.progress+'%'); }
  if(['active','done','hold'].includes(r.status) && r.status!==p.status){ p.status=r.status; if(r.status==='done') p.progress=100; ch.push('Status → '+projStatusLabel(r.status)); }
  if(typeof r.next==='string' && r.next.trim()){ p.next=r.next.trim(); ch.push('Next step → '+p.next); }
  return ch;
}

      if(!t) throw new Error('empty answer');
      return JSON.parse(t.replace(/^```json|```$/g,'').trim());
    }catch(e){ if(attempt===0 && /\b404\b/.test(e.message)){ store.set('geminiModel',''); continue; } throw e; }
  }
}

function compressImage(file, maxDim, quality){
  maxDim = maxDim || 1280; quality = quality || 0.72;
  return new Promise((resolve)=>{
    if(!file || !file.type || !file.type.startsWith('image/')){ resolve(null); return; }
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = ()=>{
      let w=img.naturalWidth, h=img.naturalHeight;
      if(w>maxDim || h>maxDim){
        if(w>h){ h=Math.round(h*maxDim/w); w=maxDim; } else { w=Math.round(w*maxDim/h); h=maxDim; }
      }
      const canvas=document.createElement('canvas'); canvas.width=w; canvas.height=h;
      canvas.getContext('2d').drawImage(img,0,0,w,h);
      URL.revokeObjectURL(url);
      try{ resolve(canvas.toDataURL('image/jpeg', quality)); }catch(e){ resolve(null); }
    };
    img.onerror=()=>{ URL.revokeObjectURL(url); resolve(null); };
    img.src = url;
  });
}
function dataURLtoBlob(dataURL){
  const [meta, b64] = dataURL.split(',');
  const mime = meta.match(/:(.*?);/)[1];
  const bin = atob(b64);
  const arr = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i);
  return new Blob([arr], {type: mime});
}
function viewReceipt(dataUrl){
  try{
    const blob = dataURLtoBlob(dataUrl);
    const url = URL.createObjectURL(blob);
    window.open(url, '_blank');
  }catch(e){ window.open(dataUrl, '_blank'); }
}

function dayItems(iso){
  const list = [];
  data.tasks.filter(t=>t.due===iso).forEach(t=>list.push({type:'task',time:t.visitTime||'',title:t.title,ref:t}));
  data.schedule.filter(s=>s.date===iso).forEach(s=>list.push({type:'schedule',time:s.start||'',title:s.title,ref:s}));
  data.surveys.filter(s=>s.date===iso).forEach(s=>list.push({type:'survey',time:'',title:`Site survey — ${s.customer||'Untitled'}`,ref:s}));
  list.sort((a,b)=>(a.time||'99:99').localeCompare(b.time||'99:99'));
  return list;
}

      const s = {id:Date.now(),customer:cc.name||it.title,phone:cc.phone||'',city:cc.location||'',villa:cc.villa||'',date:it.due||todayISO(),sections:[]};
      data.surveys.unshift(s); it.surveyId = s.id; save('surveys'); save('tasks');
      currentSurveyId = s.id;
    }
    currentTaskId = null; navigateTo('surveys');
  };
}

let currentSurveyId = null;
function renderSurveys(el){
  if(currentSurveyId) return renderSurveyDetail(el);
  const items = [...data.surveys].sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  el.innerHTML = `<div class="eyebrow">SITE SURVEYS</div><h1 class="title">Site Surveys</h1><div class="sub">Measurements, photos and customer needs per garden area — for building the BOQ later</div>
    <div class="panel">
      <form id="addForm" style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px">
        <input type="text" name="customer" placeholder="Customer name" required style="flex:1;min-width:130px;padding:8px 10px;border:1px solid var(--line);border-radius:7px;background:var(--paper);color:var(--ink)">
        <input type="text" name="phone" placeholder="Phone number" style="flex:1;min-width:110px;padding:8px 10px;border:1px solid var(--line);border-radius:7px;background:var(--paper);color:var(--ink)">
        <input type="text" name="city" placeholder="City" style="flex:1;min-width:100px;padding:8px 10px;border:1px solid var(--line);border-radius:7px;background:var(--paper);color:var(--ink)">
        <input type="text" name="villa" placeholder="Villa number" style="flex:1;min-width:100px;padding:8px 10px;border:1px solid var(--line);border-radius:7px;background:var(--paper);color:var(--ink)">
        <input type="date" name="date" value="${todayISO()}" style="padding:8px 10px;border:1px solid var(--line);border-radius:7px;background:var(--paper);color:var(--ink)">

      </form>
      ${items.length? items.map(s=>`<div class="survcard" data-open="${s.id}"><b>${escapeHtml(s.customer||'Untitled')}</b><p style="margin:4px 0 0;color:var(--ink-soft);font-size:12.8px">${[s.villa&&`Villa ${escapeHtml(s.villa)}`,s.city&&escapeHtml(s.city),s.phone&&escapeHtml(s.phone)].filter(Boolean).join(' · ')} — ${fmtDate(s.date)} · ${(s.sections||[]).length} area${(s.sections||[]).length===1?'':'s'}</p></div>`).join('')
        : '<div class="empty">No surveys yet — start one above before your next site visit.</div>'}

    data.surveys.unshift(s); save('surveys'); currentSurveyId=s.id; renderView();
  };
}
function renderSurveyDetail(el){
  const s = data.surveys.find(x=>x.id==currentSurveyId);
  if(!s){ currentSurveyId=null; return renderSurveys(el); }
  el.innerHTML = `<button class="backlink" id="backBtn">← All surveys</button>
    <div class="eyebrow">SITE SURVEY</div><h1 class="title">${escapeHtml(s.customer||'Untitled')}</h1>
    <div class="sub">${[s.villa&&`Villa ${escapeHtml(s.villa)}`,s.city&&`<a href="${escapeHtml(mapsLink(s.city))}" target="_blank" rel="noopener" style="color:var(--forest);font-weight:600">📍 ${escapeHtml(s.city)}</a>`,s.phone&&escapeHtml(s.phone),fmtDate(s.date)].filter(Boolean).join(' · ')} <button class="del" id="editSurvey">edit details</button></div>
    <div class="panel">
      <h2>Quotation reminder</h2>
      <div class="count">${(()=>{ const t=data.tasks.find(x=>x.id===s.quotationTaskId); return t ? `You'll be reminded on ${fmtDate(t.due)} to send the quotation.` : "Tell the customer a timeframe, then set a reminder here so it doesn't slip."; })()}</div>
      <form id="quoteForm" style="display:flex;gap:8px;align-items:center;margin-top:10px">
        <span style="font-size:13px">Send quotation in</span>
        <input type="number" name="days" min="1" value="2" style="width:64px;padding:8px 10px;border:1px solid var(--line);border-radius:7px;background:var(--paper);color:var(--ink)">
        <span style="font-size:13px">day(s)</span>

      <button class="addbtn" id="printBtn" style="margin-bottom:14px">🖨 Print this survey</button>

        <div style="display:flex;justify-content:space-between;align-items:flex-start"><div><b>${escapeHtml(sec.name)}</b>${sec.measurements?` <span style="color:var(--ink-soft);font-size:12.8px">— ${escapeHtml(sec.measurements)}</span>`:''}</div><button class="del" data-delsec="${sec.id}">remove area</button></div>

      t = {id:Date.now(),title:`Send quotation — ${s.customer||'customer'}`,tag:'work',priority:'reminder',due:dueISO,recur:'',project:'',

  });
  el.querySelector('#addSection').onsubmit=(e)=>{
    e.preventDefault(); const f=new FormData(e.target);
    s.sections = s.sections||[];
    s.sections.push({id:Date.now(),name:f.get('name'),measurements:f.get('measurements')||'',photos:[]});
    save('surveys'); renderView();
  };
  el.querySelectorAll('form.addphoto').forEach(form=>{

      const sec = s.sections.find(x=>x.id==secId);
      const file = form.querySelector('input[type=file]').files[0];
      const explanation = form.querySelector('input[type=text]').value;
      if(!file) return;
      const image = await compressImage(file);
      sec.photos=sec.photos||[]; sec.photos.push({id:Date.now(),image:image||'',explanation}); save('surveys'); renderView();
    };
  });
}

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const micBtn = document.getElementById('micBtn');
if(!SR){ micBtn.disabled = true; micBtn.title = 'Voice input not supported in this browser'; }
else{
  const rec = new SR(); rec.lang='en-US'; rec.interimResults=false;
  let listening=false;
  micBtn.onclick=()=>{
    if(listening) return;
    listening=true; micBtn.classList.add('on');
    rec.start();
  };
  rec.onresult=(e)=>{
    const text = e.results[0][0].transcript;
    data.tasks.push({id:Date.now(),title:text,tag:'work',priority:'',due:todayISO(),recur:'',done:false});
    save('tasks'); navigateTo('tasks');
  };
  rec.onend=()=>{ listening=false; micBtn.classList.remove('on'); };
  rec.onerror=()=>{ listening=false; micBtn.classList.remove('on'); };
}

function checkNotify(){
  if(!('Notification' in window) || Notification.permission!=='granted') return;
  const t = todayISO();
  const overdue = data.tasks.filter(x=>!x.done && x.due && x.due<t).length;
  const dueToday = data.tasks.filter(x=>!x.done && x.due===t).length;
  if(overdue || dueToday){
    const sig = `${overdue}-${dueToday}-${t}`;
    if(store.get('notifSig','')!==sig){
      store.set('notifSig', sig);
      const parts=[]; if(overdue) parts.push(`${overdue} overdue`); if(dueToday) parts.push(`${dueToday} due today`);
      try{ new Notification('Daily Manager', {body: parts.join(' · ')}); }catch(e){}
    }
  }
  const now = new Date();
  let changed=false;
  data.tasks.forEach(x=>{
    if(x.done || !x.due || x.remindBefore==='' || x.remindBefore==null || x.notifiedVisit) return;
    const visitAt = new Date(`${x.due}T${x.visitTime||'09:00'}:00`);
    const fireAt = new Date(visitAt.getTime() - Number(x.remindBefore)*60000);
    if(now >= fireAt){
      const when = x.visitTime ? `at ${x.visitTime}` : `on ${fmtDate(x.due)}`;
      try{ new Notification('Site visit reminder', {body: `${x.title} — ${when}`}); }catch(e){}
      x.notifiedVisit = true; changed=true;
    }
  });
  if(changed) save('tasks');
}
checkNotify();
setInterval(checkNotify, 5*60*1000);
(function checkLock(){
  const pin = store.get('pin','');
  if(!pin) return;
  const overlay = document.createElement('div');
  overlay.style = 'position:fixed;inset:0;background:var(--forest-deep);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;z-index:999;padding-top:env(safe-area-inset-top,0px)';
  overlay.innerHTML = `<div style="font-family:Fraunces,serif;font-size:20px">Enter PIN</div><input id="pinInput" type="password" inputmode="numeric" maxlength="6" style="font-size:22px;text-align:center;letter-spacing:6px;padding:10px 16px;border-radius:8px;border:none;width:160px"><div id="pinErr" style="color:#E7A9A9;font-size:13px;height:16px"></div>`;
  document.body.appendChild(overlay);
  document.querySelector('.app').style.visibility='hidden';
  const input = overlay.querySelector('#pinInput'); input.focus();
  input.oninput=()=>{
    if(input.value.length>=pin.length){
      if(input.value===pin){ overlay.remove(); document.querySelector('.app').style.visibility='visible'; }
      else { document.getElementById('pinErr').textContent='Incorrect PIN'; input.value=''; }
    }
  };
})();
