name: Morning brief
on:
  schedule:
    - cron: '17 2 * * *'   # every day 06:17 Abu Dhabi time
  workflow_dispatch:        # "Run workflow" button to refresh now
permissions:
  contents: write
jobs:
  brief:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build today's brief
        env:
          TZ: Asia/Dubai
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 scripts/morning_brief.py
      - name: Save news.json
        run: |
          git config user.name "morning-brief-bot"
          git config user.email "actions@users.noreply.github.com"
          git add news.json
          git diff --cached --quiet || git commit -m "Morning brief $(TZ=Asia/Dubai date +%F)"
          git push
